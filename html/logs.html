<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logs</title>
    <script src="tailwind.js"></script>
    <script src="/nav-drawer.js" defer></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans p-6">
    <nav-drawer></nav-drawer>
    <div class="max-w-4xl mx-auto space-y-6">

        <!-- Controls Header -->
        <header class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-xl font-bold font-mono text-cyan-400">LOGS</h1>
            <div id="sse-status" class="text-xs font-mono text-amber-400 bg-amber-950/40 border border-amber-800 px-3 py-1 rounded-full">
                LOGS CONNECTING...
            </div>
        </header>

        <!-- Realtime Go Terminal Log Box -->
        <div class="bg-gray-900 rounded-lg border border-gray-800 overflow-hidden shadow-xl">
            <div class="p-3 bg-gray-900 border-b border-gray-800 font-mono text-xs text-gray-400 flex justify-between">
                <span>💻 GO PROCESS LOG STREAM</span>
                <!-- Log Controls Group -->
                <div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-1">
                        <label for="max-logs" class="text-gray-500 text-[11px]">Max Logs:</label>
                        <select id="max-logs" onchange="updateMaxLogs(this.value)" class="bg-gray-950 text-gray-300 border border-gray-800 rounded px-1.5 py-0.5 text-xs focus:outline-none focus:border-cyan-500">
                            <option value="100">100</option>
                            <option value="250">250</option>
                            <option value="500" selected>500</option>
                            <option value="1000">1000</option>
                            <option value="2000">2000</option>
                            <option value="5000">5000</option>
                        </select>
                    </div>
                    <span class="text-gray-700">|</span>
                    <button onclick="document.getElementById('log-box').innerText=''" class="text-gray-500 hover:text-gray-300 transition-colors">Clear</button>
                </div>
            </div>
            <pre id="log-box" class="p-4 bg-black text-emerald-400 font-mono text-xs h-64 overflow-y-auto whitespace-pre-wrap leading-relaxed"></pre>
        </div>

    </div>

    <script>
        const logBox = document.getElementById('log-box');
        const sseStatus = document.getElementById('sse-status');
        const maxLogsSelect = document.getElementById('max-logs');

        // Initialize Server-Sent Events endpoint
        const evtSource = new EventSource("/logs/stream");

        // 1. Connection Lifecycle Handlers
        evtSource.onopen = () => {
            sseStatus.innerText = "LOG STREAM CONNECTED";
            sseStatus.className = "text-xs font-mono text-emerald-400 bg-emerald-950/40 border border-emerald-800 px-3 py-1 rounded-full";
        };

        evtSource.onerror = () => {
            sseStatus.innerText = "LOGS DISCONNECTED / RETRYING";
            sseStatus.className = "text-xs font-mono text-rose-400 bg-rose-950/40 border border-rose-800 px-3 py-1 rounded-full";
        };

        // 2. Stream Incoming Raw Log Lines
        evtSource.onmessage = (event) => {
            logBox.innerText += `${event.data}\n`;
            enforceMaxLogs(); // Trims display based on current dropdown setting
            logBox.scrollTop = logBox.scrollHeight; // Auto-scroll to bottom
        };

        // 3. Multi-Client Dropdown Sync Listener
        // Triggers when the Go backend broadcasts `event: configChange`
        evtSource.addEventListener("configChange", (event) => {
            const data = JSON.parse(event.data);
            
            // Sync dropdown value across all browser tabs
            if (data.maxLogs !== undefined) {
                maxLogsSelect.value = data.maxLogs;
                enforceMaxLogs();
            }
        });

        // 4. Helper to Trim Excess Log Lines in UI Buffer
        function enforceMaxLogs() {
            const maxVal = parseInt(maxLogsSelect.value);
            if (maxVal <= 0) return; // 0 = Unlimited

            const lines = logBox.innerText.split('\n');
            if (lines.length > maxVal) {
                // Retain only the most recent N lines
                logBox.innerText = lines.slice(lines.length - maxVal).join('\n');
            }
        }

        // 5. HTTP POST Request to Broadcast Change to Server
        async function updateMaxLogs(maxLogs) {
            enforceMaxLogs(); // Trims UI immediately for active user

            try {
                await fetch('/logs/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ maxLogs: parseInt(maxLogs) })
                });
            } catch (err) {
                console.error("Failed to sync max logs setting:", err);
            }
        }
    </script>
</body>
</html>
